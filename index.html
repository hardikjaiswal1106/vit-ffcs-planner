<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIT FFCS Planner — 4th Sem</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hdr">
  <div class="hdr-title">VIT <span>FFCS</span> Planner — 4th Sem</div>
  <div class="hdr-r">
    <button class="btn-gen" onclick="generate()">⚡ Generate Timetables</button>
    <button class="btn-clr" onclick="if(confirm('Clear all?')){S.priorities={};S.combos=[];render()}">Clear</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-scroll">
      <div class="sb-sec"><div class="sb-title">Faculty Priority — click to expand</div></div>
      <div id="course-cards"></div>
    </div>
  </aside>
  <main class="main">
    <div class="legend">
      <div class="leg-i"><div class="leg-d" style="background:#7C3AED"></div>BACSE201 Models of Computation</div>
      <div class="leg-i"><div class="leg-d" style="background:#0EA5E9"></div>BACSE204 Software Engineering</div>
      <div class="leg-i"><div class="leg-d" style="background:#059669"></div>BACSE205 Fundamentals of AIML</div>
      <div class="leg-i"><div class="leg-d" style="background:#DC2626"></div>BACSE325 Full Stack</div>
    </div>
    <div id="results"></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
